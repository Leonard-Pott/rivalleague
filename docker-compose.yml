name: rivalleague

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivalleague
      POSTGRES_PASSWORD: rivalleague
      POSTGRES_DB: rivalleague
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
